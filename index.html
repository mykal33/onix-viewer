<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete ONIX 2.1 & 3.0 Metadata Viewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 p-4 md:p-8">
  <div class="max-w-6xl mx-auto">
    <!-- Header -->
    <header class="mb-8 text-center">
      <h1 class="text-3xl font-extrabold text-slate-900">ONIX Metadata Inspector</h1>
      <p class="text-slate-600 mt-2">Comprehensive visual parser for publisher ONIX feeds.</p>
    </header>

    <!-- Upload Box -->
    <div class="border-2 border-dashed border-indigo-300 rounded-xl p-8 bg-white text-center hover:border-indigo-500 transition shadow-sm">
      <input type="file" id="fileInput" accept=".xml" class="hidden" onchange="handleFile(event)">
      <label for="fileInput" class="cursor-pointer font-semibold text-indigo-600 hover:text-indigo-800 text-lg">
        📁 Click here to upload ONIX XML
      </label>
      <p class="text-slate-400 text-sm mt-1">Supports ONIX 2.1 and ONIX 3.0 formats</p>
    </div>

    <!-- Stats Bar -->
    <div id="stats" class="mt-6 hidden flex justify-between items-center bg-indigo-900 text-white px-6 py-3 rounded-lg shadow-sm">
      <span id="publisherInfo" class="font-medium text-sm"></span>
      <span id="recordCount" class="font-bold text-sm bg-indigo-700 px-3 py-1 rounded-full"></span>
    </div>

    <!-- Catalog Container -->
    <div id="catalog" class="mt-8 space-y-6"></div>
  </div>

  <script>
    function handleFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        parseONIX(e.target.result);
      };
      reader.readAsText(file);
    }

    function getDirectText(element, selector) {
      if (!element) return '';
      const target = element.querySelector(selector);
      return target ? target.textContent.trim() : '';
    }

    function parseONIX(xmlText) {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, "text/xml");
      const catalog = document.getElementById('catalog');
      const stats = document.getElementById('stats');
      const publisherInfo = document.getElementById('publisherInfo');
      const recordCount = document.getElementById('recordCount');

      catalog.innerHTML = '';

      // Extract Publisher Header Info
      const sender = getDirectText(xmlDoc, 'Header > FromCompany') || 'Publisher Feed';
      const sentDate = getDirectText(xmlDoc, 'Header > SentDate');
      publisherInfo.textContent = `Source: ${sender} ${sentDate ? '• Sent Date: ' + sentDate : ''}`;

      const products = xmlDoc.querySelectorAll('Product, product');

      if (products.length === 0) {
        catalog.innerHTML = '<div class="bg-red-50 text-red-600 p-4 rounded-lg">No ONIX product records found in this file.</div>';
        return;
      }

      stats.classList.remove('hidden');
      recordCount.textContent = `${products.length} Products Found`;

      products.forEach(product => {
        // Basic Info
        const title = getDirectText(product, 'Title > TitleText, TitleDetail > TitleText, TitleText, b203') || 'Untitled';
        const subtitle = getDirectText(product, 'Title > TitleSubTitle');
        const series = getDirectText(product, 'Series > TitleOfSeries');
        const format = getDirectText(product, 'ProductFormDescription') || getDirectText(product, 'ProductForm') || 'Book';
        const pubStatus = getDirectText(product, 'PublishingStatus');
        
        // ISBN & Identifiers
        let isbn13 = "N/A";
        let biblioId = getDirectText(product, 'RecordReference');
        
        product.querySelectorAll('ProductIdentifier').forEach(id => {
          const type = getDirectText(id, 'ProductIDType');
          if (type === '15') isbn13 = getDirectText(id, 'IDValue');
        });

        // Contributors (Authors/Illustrators)
        const contributors = Array.from(product.querySelectorAll('Contributor')).map(c => {
          const name = getDirectText(c, 'PersonName') || getDirectText(c, 'KeyNames');
          const roleCode = getDirectText(c, 'ContributorRole');
          const role = roleCode === 'A01' ? 'Author' : roleCode === 'A12' ? 'Illustrator' : 'Contributor';
          return `<span class="inline-block bg-slate-100 text-slate-700 px-2 py-0.5 rounded text-xs mr-1">${name} <i>(${role})</i></span>`;
        }).join('');

        // Description / Annotation
        let description = '';
        product.querySelectorAll('OtherText').forEach(ot => {
          const type = getDirectText(ot, 'TextTypeCode');
          if (type === '01' || type === '02') {
            description = getDirectText(ot, 'Text');
          }
        });

        // Cover Image URL
        const imageLink = getDirectText(product, 'MediaFile > MediaFileLink') || getDirectText(product, 'SupportingResource > ResourceVersion > ResourceLink');

        // Page Count / Extent
        const extentVal = getDirectText(product, 'Extent > ExtentValue');
        const extentUnit = getDirectText(product, 'Extent > ExtentUnit') === '03' ? 'pages' : '';

        // Publisher / Imprint
        const publisher = getDirectText(product, 'Publisher > PublisherName');
        const imprint = getDirectText(product, 'Imprint > ImprintName');
        const pubDate = getDirectText(product, 'PublicationDate');

        // Price
        const priceAmount = getDirectText(product, 'SupplyDetail > Price > PriceAmount') || getDirectText(product, 'Price > PriceAmount');
        const currency = getDirectText(product, 'SupplyDetail > Price > CurrencyCode') || getDirectText(product, 'Price > CurrencyCode');
        const priceType = getDirectText(product, 'SupplyDetail > Price > PriceTypeDescription');

        // Subjects / BISAC
        const subjects = Array.from(product.querySelectorAll('Subject')).map(s => {
          const heading = getDirectText(s, 'SubjectHeadingText');
          return heading ? `<span class="inline-block bg-amber-50 text-amber-800 border border-amber-200 text-xs px-2 py-1 rounded mr-1 mb-1">${heading}</span>` : '';
        }).join('');

        // Complexity (Lexile, Grade Level, Guided Reading)
        const complexities = Array.from(product.querySelectorAll('Complexity')).map(c => {
          const scheme = getDirectText(c, 'ComplexitySchemeIdentifier');
          const code = getDirectText(c, 'ComplexityCode');
          let label = 'Score';
          if (scheme === '06') label = 'Lexile';
          if (scheme === '07') label = 'Grade Level';
          if (scheme === '02') label = 'Guided Reading';
          return `<span class="bg-indigo-50 text-indigo-700 px-2 py-1 rounded text-xs font-semibold mr-2">${label}: ${code}</span>`;
        }).join('');

        // Render Card
        const cardHTML = `
          <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col md:flex-row hover:shadow-md transition">
            <!-- Cover Image Container -->
            <div class="w-full md:w-48 bg-slate-100 p-4 flex items-center justify-center shrink-0 border-b md:border-b-0 md:border-r border-slate-200">
              ${imageLink ? 
                `<img src="${imageLink}" alt="Cover image" class="max-h-56 object-contain rounded shadow-sm" loading="lazy" onerror="this.onerror=null; this.src='https://via.placeholder.com/150x200?text=No+Cover';">` : 
                `<div class="text-slate-400 text-xs text-center p-8">No Cover Image Available</div>`
              }
            </div>

            <!-- Content Container -->
            <div class="p-6 flex-1 flex flex-col justify-between">
              <div>
                <!-- Top Tags -->
                <div class="flex flex-wrap items-center gap-2 mb-2">
                  <span class="bg-indigo-600 text-white text-xs font-bold px-2.5 py-0.5 rounded">ISBN: ${isbn13}</span>
                  <span class="bg-slate-200 text-slate-700 text-xs font-semibold px-2 py-0.5 rounded">${format}</span>
                  ${series ? `<span class="bg-purple-100 text-purple-800 text-xs font-semibold px-2 py-0.5 rounded">Series: ${series}</span>` : ''}
                  <span class="text-slate-400 text-xs">Ref: ${biblioId}</span>
                </div>

                <!-- Title & Subtitle -->
                <h2 class="text-2xl font-bold text-slate-900 leading-tight">${title}</h2>
                ${subtitle ? `<p class="text-slate-500 font-medium text-sm mt-0.5">${subtitle}</p>` : ''}

                <!-- Authors -->
                <div class="mt-2 flex flex-wrap items-center">
                  ${contributors}
                </div>

                <!-- Description -->
                ${description ? `<p class="text-slate-600 text-sm mt-3 line-clamp-3 hover:line-clamp-none transition-all cursor-pointer">${description}</p>` : ''}

                <!-- Subjects & Keywords -->
                ${subjects ? `<div class="mt-3 flex flex-wrap">${subjects}</div>` : ''}
              </div>

              <!-- Bottom Data Grid -->
              <div class="mt-6 pt-4 border-t border-slate-100 flex flex-wrap justify-between items-center gap-4 text-xs">
                <div class="space-y-1">
                  <p><span class="font-semibold text-slate-700">Publisher:</span> ${publisher} ${imprint ? `(${imprint})` : ''}</p>
                  <p><span class="font-semibold text-slate-700">Pub Date:</span> ${pubDate || 'N/A'} ${extentVal ? `• ${extentVal}${extentUnit}` : ''}</p>
                </div>

                <!-- Reading Level / Complexity -->
                <div>
                  ${complexities}
                </div>

                <!-- Price Block -->
                <div class="text-right">
                  <div class="text-xl font-black text-slate-900">${currency} ${priceAmount || 'N/A'}</div>
                  ${priceType ? `<div class="text-[10px] text-slate-400">${priceType}</div>` : ''}
                </div>
              </div>
            </div>
          </div>
        `;

        catalog.innerHTML += cardHTML;
      });
    }
  </script>
</body>
</html>
