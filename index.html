<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONIX Metadata Inspector & CSV Exporter</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 p-4 md:p-8">
  <div class="max-w-7xl mx-auto">
    <!-- Header -->
    <header class="mb-8 text-center">
      <h1 class="text-3xl font-extrabold text-slate-900">ONIX Metadata Inspector</h1>
      <p class="text-slate-600 mt-2">Comprehensive parser & QA viewer with instant CSV export.</p>
    </header>

    <!-- Upload Box -->
    <div class="border-2 border-dashed border-indigo-300 rounded-xl p-8 bg-white text-center hover:border-indigo-500 transition shadow-sm">
      <input type="file" id="fileInput" accept=".xml" class="hidden" onchange="handleFile(event)">
      <label for="fileInput" class="cursor-pointer font-semibold text-indigo-600 hover:text-indigo-800 text-lg">
        📁 Click here to upload ONIX XML
      </label>
      <p class="text-slate-400 text-sm mt-1">Supports ONIX 2.1 and ONIX 3.0 formats</p>
    </div>

    <!-- Toolbar / Action Bar -->
    <div id="statsBar" class="mt-6 hidden flex flex-col md:flex-row justify-between items-center bg-indigo-900 text-white px-6 py-4 rounded-xl gap-4 shadow-sm">
      <div>
        <span id="publisherInfo" class="font-medium text-sm block md:inline"></span>
        <span id="recordCount" class="font-bold text-xs bg-indigo-700 px-3 py-1 rounded-full ml-0 md:ml-2 mt-2 md:mt-0 inline-block"></span>
      </div>
      <button onclick="exportToCSV()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-sm px-5 py-2.5 rounded-lg shadow transition flex items-center gap-2">
        📥 Export All Data to CSV
      </button>
    </div>

    <!-- Catalog Container -->
    <div id="catalog" class="mt-8 space-y-6"></div>
  </div>

  <script>
    let parsedBooks = [];

    function handleFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        parseONIX(e.target.result);
      };
      reader.readAsText(file);
    }

    function getDirectText(element, selector) {
      if (!element) return '';
      const target = element.querySelector(selector);
      return target ? target.textContent.trim() : '';
    }

    function parseONIX(xmlText) {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, "text/xml");
      const catalog = document.getElementById('catalog');
      const statsBar = document.getElementById('statsBar');
      const publisherInfo = document.getElementById('publisherInfo');
      const recordCount = document.getElementById('recordCount');

      catalog.innerHTML = '';
      parsedBooks = [];

      // Extract Header Info
      const sender = getDirectText(xmlDoc, 'Header > FromCompany') || 'Publisher Feed';
      const sentDate = getDirectText(xmlDoc, 'Header > SentDate');
      publisherInfo.textContent = `Source: ${sender} ${sentDate ? '• Sent Date: ' + sentDate : ''}`;

      const products = xmlDoc.querySelectorAll('Product, product');

      if (products.length === 0) {
        catalog.innerHTML = '<div class="bg-red-50 text-red-600 p-4 rounded-lg">No ONIX product records found in this file.</div>';
        return;
      }

      statsBar.classList.remove('hidden');
      recordCount.textContent = `${products.length} Product Records`;

      products.forEach(product => {
        // Record Reference & Formats
        const recordRef = getDirectText(product, 'RecordReference');
        const formDesc = getDirectText(product, 'ProductFormDescription') || getDirectText(product, 'ProductForm');
        const epubDesc = getDirectText(product, 'EpubTypeDescription') || getDirectText(product, 'EpubType');

        // Titles & Series
        const title = getDirectText(product, 'Title > TitleText, TitleDetail > TitleText, TitleText, b203') || 'Untitled';
        const titleOfSeries = getDirectText(product, 'Series > TitleOfSeries');
        const seriesNo = getDirectText(product, 'Series > NumberWithinSeries');

        // All ISBNs & Identifiers
        let isbn13 = "N/A";
        const allIsbns = [];
        product.querySelectorAll('ProductIdentifier').forEach(id => {
          const type = getDirectText(id, 'ProductIDType');
          const val = getDirectText(id, 'IDValue');
          const typeName = getDirectText(id, 'IDTypeName');
          if (type === '15') isbn13 = val;
          if (val) allIsbns.push(`${typeName ? typeName + ': ' : ''}${val}`);
        });

        // Authors & Illustrators Separated
        const authors = [];
        const illustrators = [];
        const contributorsAll = [];

        product.querySelectorAll('Contributor').forEach(c => {
          const name = getDirectText(c, 'PersonName') || `${getDirectText(c, 'NamesBeforeKey')} ${getDirectText(c, 'KeyNames')}`.trim();
          const roleCode = getDirectText(c, 'ContributorRole');
          
          if (roleCode === 'A01') {
            authors.push(name);
            contributorsAll.push(`${name} (Author)`);
          } else if (roleCode === 'A12') {
            illustrators.push(name);
            contributorsAll.push(`${name} (Illustrator)`);
          } else {
            contributorsAll.push(`${name} (${roleCode})`);
          }
        });

        // Main Subject, All Subject Codes (BISACs), Keywords
        const basicMainSubject = getDirectText(product, 'BASICMainSubject');
        const bisacCodes = [];
        let keywords = '';

        // Fiction / Non-Fiction Detection
        let fictionStatus = 'Unknown';
        if (basicMainSubject.startsWith('JNF') || basicMainSubject.startsWith('NON')) {
          fictionStatus = 'Non-Fiction';
        } else if (basicMainSubject.startsWith('JUV') || basicMainSubject.startsWith('FIC')) {
          fictionStatus = 'Fiction';
        }

        product.querySelectorAll('Subject').forEach(s => {
          const scheme = getDirectText(s, 'SubjectSchemeIdentifier');
          const code = getDirectText(s, 'SubjectCode');
          const heading = getDirectText(s, 'SubjectHeadingText');

          if (scheme === '10' || scheme === '24') { // BISAC Scheme
            if (heading) bisacCodes.push(`${code ? '[' + code + '] ' : ''}${heading}`);
          } else if (scheme === '20') { // Keywords Scheme
            keywords = heading;
          }
        });

        // Descriptions
        let shortDescription = '';
        let longDescription = '';
        product.querySelectorAll('OtherText').forEach(ot => {
          const type = getDirectText(ot, 'TextTypeCode');
          const txt = getDirectText(ot, 'Text');
          if (type === '01') longDescription = txt;
          if (type === '02' || type === '17') shortDescription = txt;
        });
        if (!shortDescription) shortDescription = longDescription;

        // Age Limit & Grade Range
        let ageLimit = '';
        let gradeRange = '';
        product.querySelectorAll('AudienceRange').forEach(ar => {
          const qualifier = getDirectText(ar, 'AudienceRangeQualifier');
          const precisions = ar.querySelectorAll('AudienceRangePrecision');
          const values = ar.querySelectorAll('AudienceRangeValue');
          
          let from = values[0] ? values[0].textContent.trim() : '';
          let to = values[1] ? values[1].textContent.trim() : '';

          if (qualifier === '17') ageLimit = `${from} - ${to} Years`;
          if (qualifier === '11') gradeRange = `Grade ${from} - ${to}`;
        });

        // Rights & Supply Territories
        const rightsCountry = getDirectText(product, 'SalesRights > RightsCountry');
        const supplyToCountry = getDirectText(product, 'SupplyDetail > SupplyToCountry');

        // Publisher, Imprint & Image
        const publisher = getDirectText(product, 'Publisher > PublisherName');
        const imprint = getDirectText(product, 'Imprint > ImprintName');
        const imageLink = getDirectText(product, 'MediaFile > MediaFileLink');

        // Price
        const priceAmount = getDirectText(product, 'SupplyDetail > Price > PriceAmount') || getDirectText(product, 'Price > PriceAmount');
        const currency = getDirectText(product, 'SupplyDetail > Price > CurrencyCode') || getDirectText(product, 'Price > CurrencyCode');

        // Save Record Object for CSV Export
        const bookData = {
          "Record Reference": recordRef,
          "ISBN-13": isbn13,
          "All Identifiers": allIsbns.join(' | '),
          "Title": title,
          "Series Title": titleOfSeries,
          "Series No": seriesNo,
          "Authors": authors.join(', '),
          "Illustrators": illustrators.join(', '),
          "Format": `${formDesc} (${epubDesc})`,
          "BASIC Main Subject": basicMainSubject,
          "Fiction/Non-Fiction": fictionStatus,
          "All BISAC Codes": bisacCodes.join(' | '),
          "Age Limit": ageLimit,
          "Grade Range": gradeRange,
          "Keywords": keywords,
          "Short Description": shortDescription,
          "Long Description": longDescription,
          "Rights Countries": rightsCountry,
          "Supply To Countries": supplyToCountry,
          "Publisher": publisher,
          "Imprint": imprint,
          "Price": `${currency} ${priceAmount}`
        };
        parsedBooks.push(bookData);

        // Render Cards
        const cardHTML = `
          <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col md:flex-row hover:shadow-md transition">
            <!-- Cover -->
            <div class="w-full md:w-52 bg-slate-100 p-4 flex items-center justify-center shrink-0 border-b md:border-b-0 md:border-r border-slate-200">
              ${imageLink ? 
                `<img src="${imageLink}" alt="Cover image" class="max-h-60 object-contain rounded shadow-sm" loading="lazy" onerror="this.onerror=null; this.src='https://via.placeholder.com/150x200?text=No+Cover';">` : 
                `<div class="text-slate-400 text-xs text-center p-8">No Cover Image</div>`
              }
            </div>

            <!-- Content -->
            <div class="p-6 flex-1 flex flex-col justify-between">
              <div>
                <!-- Top Tags -->
                <div class="flex flex-wrap items-center gap-2 mb-2">
                  <span class="bg-indigo-600 text-white text-xs font-bold px-2.5 py-0.5 rounded">ISBN: ${isbn13}</span>
                  <span class="bg-slate-800 text-white text-xs font-semibold px-2 py-0.5 rounded">${fictionStatus}</span>
                  <span class="bg-slate-200 text-slate-700 text-xs font-semibold px-2 py-0.5 rounded">${formDesc}</span>
                  ${titleOfSeries ? `<span class="bg-purple-100 text-purple-800 text-xs font-semibold px-2 py-0.5 rounded">Series: ${titleOfSeries}${seriesNo ? '#' + seriesNo : ''}</span>` : ''}
                </div>

                <!-- Title & Authors -->
                <h2 class="text-2xl font-bold text-slate-900 leading-tight">${title}</h2>
                <div class="mt-2 flex flex-wrap gap-2 text-xs">
                  ${authors.map(a => `<span class="bg-indigo-50 text-indigo-700 border border-indigo-200 px-2 py-0.5 rounded">✍️ Author: <b>${a}</b></span>`).join('')}
                  ${illustrators.map(i => `<span class="bg-pink-50 text-pink-700 border border-pink-200 px-2 py-0.5 rounded">🎨 Illustrator: <b>${i}</b></span>`).join('')}
                </div>

                <!-- BISAC Subjects -->
                <div class="mt-3">
                  <span class="text-xs font-semibold text-slate-500 mr-2">BISAC/Subjects:</span>
                  <span class="text-xs bg-amber-50 text-amber-800 border border-amber-200 px-2 py-0.5 rounded mr-1">Main: ${basicMainSubject}</span>
                  ${bisacCodes.map(b => `<span class="inline-block bg-slate-100 text-slate-700 text-[11px] px-2 py-0.5 rounded mr-1 mt-1">${b}</span>`).join('')}
                </div>

                <!-- Audience / Age / Grade -->
                <div class="mt-3 flex flex-wrap gap-2 text-xs font-semibold text-slate-600">
                  ${ageLimit ? `<span class="bg-emerald-50 text-emerald-700 border border-emerald-200 px-2 py-0.5 rounded">🎯 Age: ${ageLimit}</span>` : ''}
                  ${gradeRange ? `<span class="bg-teal-50 text-teal-700 border border-teal-200 px-2 py-0.5 rounded">🏫 Grade: ${gradeRange}</span>` : ''}
                </div>

                <!-- Description -->
                ${shortDescription ? `<p class="text-slate-600 text-xs mt-3 bg-slate-50 p-3 rounded border border-slate-100 leading-relaxed">${shortDescription}</p>` : ''}

                <!-- Keywords -->
                ${keywords ? `<div class="mt-3 text-[11px] text-slate-500"><b>Keywords:</b> ${keywords}</div>` : ''}
              </div>

              <!-- Bottom Details Footer -->
              <div class="mt-6 pt-4 border-t border-slate-100 flex flex-wrap justify-between items-end gap-4 text-xs">
                <div class="space-y-1">
                  <p><b class="text-slate-700">Publisher / Imprint:</b> ${publisher} ${imprint ? '(' + imprint + ')' : ''}</p>
                  <p><b class="text-slate-700">Rights Territory:</b> ${rightsCountry || 'Global'}</p>
                  <p><b class="text-slate-700">Supply Territory:</b> ${supplyToCountry ? supplyToCountry.substring(0, 40) + '...' : 'Global'}</p>
                </div>

                <div class="text-right">
                  <div class="text-xl font-black text-slate-900">${currency} ${priceAmount || 'N/A'}</div>
                </div>
              </div>
            </div>
          </div>
        `;
        catalog.innerHTML += cardHTML;
      });
    }

    // CSV Download Function
    function exportToCSV() {
      if (parsedBooks.length === 0) return;

      const headers = Object.keys(parsedBooks[0]);
      const csvRows = [];

      // Add Headers
      csvRows.push(headers.map(h => `"${h}"`).join(','));

      // Add Data Rows
      parsedBooks.forEach(book => {
        const row = headers.map(header => {
          let val = book[header] || '';
          val = val.toString().replace(/"/g, '""'); // Escape Quotes
          return `"${val}"`;
        });
        csvRows.push(row.join(','));
      });

      // Create Blob & Download Link
      const csvString = csvRows.join('\n');
      const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', `ONIX_Metadata_Export_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
